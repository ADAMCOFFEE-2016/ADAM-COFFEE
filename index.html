<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADAM COFFEE — قهوة آدم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #f4ecdd;
    --espresso: #2a1a10;
    --espresso-soft: #5a4232;
    --gold: #b9812f;
    --gold-deep: #8a5f22;
    --card: #ffffff;
    --line: #e2d2b6;
    --focus: #1c6e5e;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --cream: #1c130c;
      --espresso: #f4ecdd;
      --espresso-soft: #cdbba4;
      --gold: #d9a24b;
      --gold-deep: #e9bd72;
      --card: #2a1c12;
      --line: #4a3524;
    }
  }
  :root[data-theme="dark"] {
    --cream: #1c130c;
    --espresso: #f4ecdd;
    --espresso-soft: #cdbba4;
    --gold: #d9a24b;
    --gold-deep: #e9bd72;
    --card: #2a1c12;
    --line: #4a3524;
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--cream);
    color: var(--espresso);
    font-family: 'Cairo', 'Tahoma', sans-serif;
    min-height: 100vh;
    display:flex;
    justify-content:center;
    padding: 40px 18px 60px;
  }
  .card{
    width:100%;
    max-width: 440px;
    text-align:center;
  }

  .badge{
    width: 148px;
    height: 148px;
    margin: 0 auto 22px;
    background: #ffffff;
    border-radius: 50%;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow: 0 6px 24px rgba(42,26,16,0.18);
    padding: 14px;
  }
  .badge img{
    width:100%;
    height:100%;
    object-fit: contain;
  }

  .brand{
    font-family: 'Fraunces', Georgia, serif;
    font-size: 34px;
    font-weight: 700;
    letter-spacing: 1px;
    direction: ltr;
    color: var(--espresso);
    margin: 0 0 4px;
  }
  .brand-ar{
    font-size: 22px;
    font-weight: 700;
    color: var(--gold-deep);
    margin: 0 0 14px;
  }
  .tagline{
    font-size: 15px;
    color: var(--espresso-soft);
    line-height: 1.9;
    margin: 0 0 6px;
  }
  .products{
    font-size: 14px;
    color: var(--gold-deep);
    font-weight: 600;
    letter-spacing: 0.3px;
    margin: 6px 0 28px;
  }

  hr.rule{
    border: none;
    border-top: 1px solid var(--line);
    margin: 0 0 26px;
  }

  .section-label{
    font-size: 13px;
    color: var(--espresso-soft);
    margin-bottom: 14px;
  }

  .socials{
    display:flex;
    justify-content:center;
    gap: 14px;
    margin-bottom: 30px;
    flex-wrap: wrap;
  }
  .social-btn{
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--card);
    border: 1.5px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    color: var(--espresso);
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .social-btn:hover{ background: var(--gold); border-color: var(--gold); color: #ffffff; transform: translateY(-2px); }
  .social-btn svg{ width: 24px; height: 24px; }

  .contact-card{
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 20px 18px;
    margin-bottom: 22px;
    text-align: start;
  }
  .contact-row{
    display:flex;
    align-items:flex-start;
    gap: 12px;
    padding: 10px 0;
  }
  .contact-row + .contact-row{ border-top: 1px solid var(--line); }
  .contact-row svg{ width:20px; height:20px; flex-shrink:0; margin-top:2px; color: var(--gold-deep); }
  .contact-row a, .contact-row span{
    color: var(--espresso);
    text-decoration:none;
    font-size: 15px;
    line-height:1.5;
    direction: ltr;
    unicode-bidi: isolate;
  }
  .contact-row .loc-text{
    direction: rtl;
    unicode-bidi: isolate;
  }

  .save-contact{
    display:block;
    width:100%;
    padding: 14px;
    background: var(--espresso);
    color: var(--cream);
    border:none;
    border-radius: 8px;
    font-family: 'Cairo', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor:pointer;
    margin-bottom: 30px;
  }
  .save-contact:hover{ background: var(--gold-deep); }
  .save-contact:focus-visible{ outline: 3px solid var(--focus); outline-offset: 2px; }

  .footer-note{
    font-size: 12px;
    color: var(--espresso-soft);
    line-height: 1.8;
  }

  .toast{
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: var(--espresso);
    color: var(--cream);
    padding: 10px 18px;
    border-radius: 4px;
    font-size: 14px;
    opacity: 0;
    transition: opacity 0.2s ease, transform 0.2s ease;
    pointer-events:none;
  }
  .toast.show{ opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
